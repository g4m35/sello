version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    ignore:
      # Next's React lint plugin still uses APIs removed in ESLint 10.
      # Revisit when eslint-plugin-react supports ESLint 10; keep v9 security patches.
      - dependency-name: eslint
        versions: [">=10.0.0 <11.0.0"]
      # Match production/CI Node 24. Change with the next runtime upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: [next, eslint-config-next, react, react-dom, "@types/react", "@types/react-dom"]
      prisma:
        patterns: [prisma, "@prisma/*"]
      supabase:
        patterns: ["@supabase/*"]
      testing:
        patterns: [vitest, "@vitest/*"]
      linting:
        patterns: [eslint, "eslint-*", "@typescript-eslint/*"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
